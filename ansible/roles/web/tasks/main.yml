# ---------- Swap (React build needs > 1 GB RAM) ----------
- name: Create 2G swap file
  ansible.builtin.shell: fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  args:
    creates: /swapfile

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"

# ---------- Packages and Node.js ----------
- name: Install base packages
  ansible.builtin.apt:
    name: [git, nginx, acl, ca-certificates, curl, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add NodeSource signing key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Add NodeSource repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
    filename: nodesource
    state: present

- name: Install Node.js (includes npm)
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

# ---------- App user and code ----------
- name: Create dedicated non-login app user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_home }}"
    create_home: true

- name: Restrict app home
  ansible.builtin.file:
    path: "{{ app_home }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0750"

- name: Clone TravelMemory repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    force: true
  become_user: "{{ app_user }}"
  register: repo
  notify: restart backend

# ---------- Backend ----------
- name: Write backend .env from vault
  ansible.builtin.template:
    src: backend.env.j2
    dest: "{{ app_dir }}/backend/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  no_log: true
  notify: restart backend

- name: Install backend dependencies
  community.general.npm:
    path: "{{ app_dir }}/backend"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_home }}"

- name: Install backend systemd unit
  ansible.builtin.template:
    src: travelmemory-backend.service.j2
    dest: /etc/systemd/system/travelmemory-backend.service
    mode: "0644"
  notify: restart backend

- name: Enable and start backend
  ansible.builtin.systemd:
    name: travelmemory-backend
    state: started
    enabled: true
    daemon_reload: true

# ---------- Frontend ----------
- name: Point React frontend at /api (same-origin via nginx)
  ansible.builtin.copy:
    dest: "{{ app_dir }}/frontend/src/url.js"
    content: 'export const baseUrl = "/api";'
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
  register: urljs

- name: Install frontend dependencies
  community.general.npm:
    path: "{{ app_dir }}/frontend"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_home }}"

- name: Check for existing build
  ansible.builtin.stat:
    path: "{{ app_dir }}/frontend/build/index.html"
  register: build

- name: Build React frontend
  ansible.builtin.command: npm run build
  args:
    chdir: "{{ app_dir }}/frontend"
  become_user: "{{ app_user }}"
  environment:
    HOME: "{{ app_home }}"
    CI: "false"
  when: repo.changed or urljs.changed or not build.stat.exists
  register: built

- name: Publish build to nginx web root
  ansible.builtin.copy:
    src: "{{ app_dir }}/frontend/build/"
    dest: "{{ web_root }}/"
    remote_src: true
    owner: root
    group: root
    mode: u=rwX,g=rX,o=rX
  when: built.changed

# ---------- nginx ----------
- name: Install nginx site
  ansible.builtin.copy:
    src: travelmemory.nginx
    dest: /etc/nginx/sites-available/travelmemory
    mode: "0644"
  notify: reload nginx

- name: Enable site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/travelmemory
    dest: /etc/nginx/sites-enabled/travelmemory
    state: link
  notify: reload nginx

- name: Disable default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Ensure nginx running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
